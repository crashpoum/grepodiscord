services:
  bot:
    build: .
    image: grepocord:latest
    container_name: grepocord
    restart: unless-stopped
    env_file: .env
    environment:
      # Existing installs: a ./data/grepodiscord.sqlite from v1 is renamed to grepocord.sqlite on first start.
      DB_PATH: /app/data/grepocord.sqlite
    volumes:
      - ./data:/app/data
    # No host ports: the live window web app (WEB_PORT, default 8080) is only reachable inside the compose network,
    # where the cloudflared service below publishes it through a Cloudflare named tunnel (outbound only).
    expose: ["8080"]
    # To test the web app on this machine only, uncomment:
    # ports: ["127.0.0.1:8080:8080"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Cloudflare named tunnel for the live window / Activity (see SETUP-ACTIVITY.md).
  # Enabled with COMPOSE_PROFILES=tunnel in .env (or: docker compose --profile tunnel up -d).
  # In the Cloudflare dashboard, point the tunnel's public hostname to http://bot:8080
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: grepocord-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    # Token passed on the command line (compose fills it from .env); TUNNEL_TOKEN in the environment was not picked up on some hosts.
    command: ["tunnel","--no-autoupdate","run","--token","${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on: [bot]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-off: register slash commands →  docker compose run --rm register
  register:
    image: grepocord:latest
    profiles: ["tools"]
    env_file: .env
    command: ["node", "--disable-warning=ExperimentalWarning", "compiled/register.js"]

  # One-off dry run without Discord →  docker compose run --rm cli refresh gr125
  cli:
    image: grepocord:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      CLI_DB_PATH: /app/data/cli.sqlite
    volumes:
      - ./data:/app/data
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh", "node", "--disable-warning=ExperimentalWarning", "compiled/cli.js"]
