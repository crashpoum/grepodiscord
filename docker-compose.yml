services:
  bot:
    build: .
    image: grepocord:latest
    container_name: grepocord
    restart: unless-stopped
    env_file: .env
    environment:
      # Existing installs: a ./data/grepodiscord.sqlite from v1 is renamed to grepocord.sqlite on first start.
      DB_PATH: /app/data/grepocord.sqlite
    volumes:
      - ./data:/app/data
    # No ports exposed: the bot only makes outbound connections (Discord gateway, grepolis.com, grepodata.com).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-off: register slash commands →  docker compose run --rm register
  register:
    image: grepocord:latest
    profiles: ["tools"]
    env_file: .env
    command: ["node", "--disable-warning=ExperimentalWarning", "compiled/register.js"]

  # One-off dry run without Discord →  docker compose run --rm cli refresh gr125
  cli:
    image: grepocord:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      CLI_DB_PATH: /app/data/cli.sqlite
    volumes:
      - ./data:/app/data
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh", "node", "--disable-warning=ExperimentalWarning", "compiled/cli.js"]
